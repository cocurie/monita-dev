; XIAO + Adafruit VL53L4CX(STEMMA QT) ブレッドボード動作確認テスト（project08_takadakikou / 高田機工 SBBR案件）
;
; 用途: I2C接続のVL53L4CX ToFレーザー変位センサの動作確認。
;       distance(mm)とrange statusをシリアルモニタに出力する。
; 対象モジュール: Adafruit VL53L4CX (Digikey/Adafruit #5425)
;   -> SDA/SCLにプルアップ抵抗(10K)を基板側で内蔵済み。外付け抵抗は不要。
; 配線: XIAO D4(SDA)  <-> センサー SDA
;       XIAO D5(SCL)  <-> センサー SCL
;       XIAO D6(GPIO) <-> センサー XSHUT   (STMicro純正ライブラリが制御に使用。必須)
;       XIAO 3V3      <-> センサー VIN
;       XIAO GND      <-> センサー GND
;       (センサーのGPIO1/INTピンは本テストでは未接続。ポーリングモードのため不要)

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200

lib_deps =
  ; STMicroelectronics純正ライブラリ。VL53L4CX(Adafruit基板搭載チップ)向けの正式ドライバ
  ; https://github.com/stm32duino/VL53L4CX
  https://github.com/stm32duino/VL53L4CX.git
