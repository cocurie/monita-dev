; project13_ipec/firmware_gateway — アイペック案件 Gateway ファーム（CAOPEN統一版）
;
; LoRa受信 → バッファ → AT+CAOPEN で GAS / InfluxDB へ POST、Drive からダウンリンク取得。
; AT+HTTPTOFS は使わない（混在問題を構造的に回避）。
;
; ハード: Gateway ver1.1 / 1.20 / 1.21 基板（回路・ピン割当は同一）
;   LTE-M (SIM7080G): D6=TX / D7=RX（Serial1）
;   LoRa  (E220)    : D0=RX / D1=TX / D2=M0M1（UARTE1）
;   RTC   (DS3231)  : D4=SDA / D5=SCL

[env:seeed_xiao_nrf52840]
platform  = https://github.com/Seeed-Studio/platform-seeedboards.git
board     = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/RTClib@^2.1.1
build_flags =
  -D USE_TINYUSB

; ── 群の焼き分け ──
;   PLATFORMIO_BUILD_FLAGS="-D USE_TINYUSB -D GATEWAY_GROUP_ID=1" pio run -t upload
