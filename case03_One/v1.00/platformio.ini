[platformio]
default_envs = one_sensor_lora, one_sensor_sigfox, one_pir_lora, one_pir_sigfox

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
; HX711 / OneWire / DallasTemperature / VL53L4CD はlib/へ同梱。
; オフラインの製造・保守環境でも同じ依存版で再現可能にする。
build_flags =
  ; Adafruit nRF52コアでUSB CDCシリアルを有効にするために必須。
  ; これが無いと Serial.print() の出力がUSBに出てこない（ビルドは通るが無音になる）。
  ; 他のXIAO nRF52840プロジェクト（Gateway/豊能町等）と揃えている。
  -D USE_TINYUSB
  -D FW_VERSION=0x02
; DEVICE_ID（子機ID）は機体ごとに固有の値にする。Gatewayの許可範囲は 0x01〜0x0F。
; 既定値 0x0F は src/app_sensor.cpp / app_pir.cpp の #ifndef で定義している。
; ここでは定義しない（定義すると下記の上書きが redefined 警告になるため）。
; 機体ごとに焼き分けるときはビルド時に上書きする:
;   PLATFORMIO_BUILD_FLAGS="-D DEVICE_ID=0x0E" pio run -e one_sensor_lora -t upload

[env:one_sensor_lora]
build_flags = ${env.build_flags} -D COMM_MODE_LORA
build_src_filter = +<*> -<app_pir.cpp>

[env:one_sensor_sigfox]
build_flags = ${env.build_flags} -D COMM_MODE_SIGFOX
build_src_filter = +<*> -<app_pir.cpp>

[env:one_pir_lora]
build_flags = ${env.build_flags} -D COMM_MODE_LORA
build_src_filter = +<*> -<app_sensor.cpp>

[env:one_pir_sigfox]
build_flags = ${env.build_flags} -D COMM_MODE_SIGFOX
build_src_filter = +<*> -<app_sensor.cpp>
