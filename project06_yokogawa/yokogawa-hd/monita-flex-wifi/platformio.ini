; Monita Flex WiFi — XIAO ESP32-C3
; センサー: HX711×4（4052 MUX + TCA9534）/ 温度 / 電池
; 通信: WiFi（将来実装）/ BLE NUS（コントローラーからの設定変更受信）
; ハード: 回路図作成予定（ESP32-C3版）

[env:seeed_xiao_esp32c3]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

monitor_speed  = 115200
monitor_dtr    = 0
monitor_rts    = 0

upload_speed = 921600

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1   ; USB-CDC経由のSerial有効化
