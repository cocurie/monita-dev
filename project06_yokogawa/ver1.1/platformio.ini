; Monita Flex 横河基板 ver1.0 — XIAO ESP32-C3
; センサー: HX711×5（4051 MUX + MCP23008）/ MCP9600 熱電対 / ADS1115 ±10V×2
; 記録  : SD カード（SPI）
; 通信  : WiFi（将来実装）/ BLE NUS（コントローラーからの設定変更受信）
; ハード: netlist_yokogawa_v1（2026/07/09 エクスポート）

[env:seeed_xiao_esp32c3]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0

upload_speed = 921600

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1   ; USB-CDC経由のSerial有効化
  -D COMM_USE_BLE              ; WiFi送信モード（他の選択肢: COMM_USE_BLE / COMM_USE_SERIAL              ; WiFi送信モード（他の選択肢: COMM_USE_BLE / COMM_USE_SERIAL）

lib_deps =
  bogde/HX711@^0.7.5
  adafruit/Adafruit ADS1X15@^2.5.0
  adafruit/Adafruit BusIO@^1.16.0
  h2zero/NimBLE-Arduino@^1.4.1

; MCP9600はESP32-C3のI2Cクロックストレッチングタイムアウト制約（5bit）により
; ハードウェアWireで通信できないため、Adafruitライブラリを使わず
; src/soft_i2c.cpp のビットバングI2Cで直接レジスタ操作している。
