; Monita Flex 横河基板 ver1.3 — XIAO ESP32-C3（LoRa対応基板）
; センサー: HX711×5（4051 MUX + MCP23008）/ MCP9600 熱電対 / ADS1115 ±10V×2
; 記録  : SD カード（SPI、CSはver1.1のD7からD0へ移設）
; 通信  : LoRa（E220-900T22S(JP)、標準構成。Gateway接続は常にLoRa）/ WiFi / SERIAL（デバッグ）
;         ★2026-09-06: データ送信方式としての単体BLEモードは削除。LoRaビルドでは
;         コントローラー連携用のBLE GATTサーバー（TARE・計測間隔変更等）を常設する。
; ハード: netlist "ver1.2 (~recovered).ipc"（2026/09/03エクスポート、内容はver1.3基板のもの）

[env:seeed_xiao_esp32c3]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino

monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0

upload_speed = 921600

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1   ; USB-CDC経由のSerial有効化
  -D COMM_USE_LORA              ; LoRa送信モード（他の選択肢: COMM_USE_WIFI / COMM_USE_SERIAL）
  ; ★2026-09-12: 専用RTCが無いフィールドユニットの「Gateway同期前の暫定時刻」を
  ; __DATE__/__TIME__（main.cppのソースを実際に再コンパイルした瞬間のみ更新される。
  ; ソース無変更のままアップロードし直しても値が古いまま＝一見「時刻が壊れている」ように
  ; 見えて混乱の元だった）から、ビルドのたびに必ず新しく評価される値へ変更する。
  ; 実際の値の注入は extra_scripts=inject_build_epoch.py（pio run/uploadのたびに必ず実行される、
  ; 下記参照）で行う。ビルドマシンのローカル時刻（JST）をUTCとして扱うnaiveなepoch秒に変換して
  ; 埋め込む（main.cpp側のrtcSetTime()/mktime()と同じ「TZ変換なし」の流儀に合わせるため）。
  ; ★2026-09-09: デバッグ用シリアルコマンド(1-8/A/H)は全ビルド共通で常時有効なので、
  ; チャンネル確認のためだけにCOMM_USE_SERIALへ切り替える必要はない。
  ;
  ; ★2026-09-10: バッテリー駆動時は下の行のコメントを外して -D BATTERY_MODE を追加する
  ; （COMM_USE_LORAとの併用時のみ有効）。計測・LoRa送信のたびにBLE_WAKE_WINDOW_MS(20秒)
  ; だけBLE接続の余地を残し、未接続ならディープスリープへ入る。USB給電でのベンチテスト・
  ; デバッグコマンドでの継続的な操作を想定する場合はこのフラグを付けないこと
  ; （付けるとBLE_WAKE_WINDOW_MS経過後にディープスリープしシリアル応答が止まる）。
  ; -D BATTERY_MODE
  ;
  ; ★工場出荷時の初期デバイスID設定用。1台書き込むごとに番号を変えてビルド・書き込みする。
  ; 設定が終わったら必ずこの行をコメントアウトして通常ビルドに戻すこと（付けたままだと
  ; 毎起動時にNVSの値が上書きされ、BLEのDEVIDコマンドでの変更ができなくなる）。
  ; -D FORCE_DEVID=30   ; コクリエ保管用
  ; -D FORCE_DEVID=1     ; 顧客用 #1
   -D FORCE_DEVID=2     ; 顧客用 #2

extra_scripts = pre:inject_build_epoch.py

lib_deps =
  bogde/HX711@^0.7.5
  adafruit/Adafruit ADS1X15@^2.5.0
  adafruit/Adafruit BusIO@^1.16.0
  h2zero/NimBLE-Arduino@^1.4.1

; MCP9600はESP32-C3のI2Cクロックストレッチングタイムアウト制約（5bit）により
; ハードウェアWireで通信できないため、Adafruitライブラリを使わず
; src/soft_i2c.cpp のビットバングI2Cで直接レジスタ操作している。
