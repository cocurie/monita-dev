; Monita Deck v1.00 — 6CH同時サンプリング計測ユニット（橋梁RC床版たわみ）
; ハード正本: 【7】Monita/01_開発/Deck基板/20260906_Monita_Deck_6CH計測ユニット_要件定義.md
;             基板 ver1.00（2026-09-12 発注）／ネットリスト netlist_ver1.00.txt
;
; 回路図と食い違う場合は回路図を正とする。

[env:seeed_xiao_nrf52840]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200

; SdFat: FAT を運用中に書き換えない記録方式（要件定義 §5.2.1 S-1〜S-5）のため
;        事前確保した連続ファイルへセクタ直書きできる SdFat を使う。標準 SD ライブラリでは不可。
lib_deps =
  greiman/SdFat

; DEVICE_ID は 上位3bit=Gateway群(0〜7) / 下位5bit=群内の機器番号(1〜31)。
;   群0 = 0x01〜0x1F、群1 = 0x21〜0x3F。下位5bitが0のIDは無効値。
; 機体ごとに焼き分けるときはビルド時に上書きする:
;   PLATFORMIO_BUILD_FLAGS="-D DEVICE_ID=0x21" pio run -t upload
build_flags =
  ; Adafruit nRF52コアでUSB CDCシリアルを有効にするために必須。
  ; これが無いと Serial.print() の出力がUSBに出てこない（ビルドは通るが無音になる）。
  ; One v1.00 の立ち上げで同じ症状が出た。他のXIAO nRF52840プロジェクトと揃えている。
  -D USE_TINYUSB
  -D DECK_FW_VERSION=0x01
