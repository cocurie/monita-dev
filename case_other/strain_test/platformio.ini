; ひずみFlexモジュール 出荷検査治具 用テストファーム
; Monita Flex ver3.20 基板をベースに、4CHすべてをHX711ひずみ測定に固定。
; 通信（Sigfox/BLE/LoRa）・スリープ・WDT・RGB LED・DS3231・電池電圧は一切使わない。
; シリアルモニタからのコマンド入力のみで動作する対話型ベンチツール。
;
; ハード正本: 【7】Monita/開発/Flex基板/Monita_Flex_構成_v3.10.md
; HX711 は `lib/HX711` に同梱（bogde/HX711 0.7.5。v3.20 と同一コピー）

[env:seeed_xiao_nrf52840_sense]
platform  = https://github.com/Seeed-Studio/platform-seeedboards.git
board     = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
; DTR はデフォルト(1)のままにする。monitor_dtr=0 にすると
; Adafruit nRF52 コアが Serial.write() を無視するため出力が届かない（v3.20と同じ注意点）。
