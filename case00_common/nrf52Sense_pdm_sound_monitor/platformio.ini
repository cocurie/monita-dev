; PDM マイク 音量モニタ — XIAO nRF52840 Sense（実験）
; platform は既存 xiao_ble_scan と同一

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board    = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200

lib_deps = kosme/arduinoFFT

; /dev/cu.usbmodem*** は pio device list で確認し、必要なら有効化する
; upload_port = /dev/cu.usbmodem1101
