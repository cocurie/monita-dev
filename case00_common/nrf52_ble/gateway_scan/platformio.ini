; BLE 親機（ゲートウェイ）— アドバタイズ受信・ログ記録（XIAO nRF52840 / Arduino）
; 親フォルダ README: ../../README.md

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
; upload_port = /dev/cu.usbmodemXXXX
; 非 Sense 版 XIAO nRF52840 の場合: board = seeed-xiao-afruitnrf52-nrf52840
