; BLE 子機 — Manufacturer Data 付きアドバタイズ（XIAO nRF52840 / Arduino）
; 親フォルダ README: ../../README.md

[env:seeed_xiao_nrf52840_sense]
platform = nordicnrf52
board = seeed_xiao_nrf52840
framework = arduino
monitor_speed = 115200
lib_deps = ArduinoBLE
; upload_port = /dev/cu.usbmodemXXXX
; 非 Sense 版 XIAO nRF52840 の場合も board = seeed_xiao_nrf52840
