; Monita Flex v3.20 — HX711×4（4052 A/B は TCA9534）/ 温度 / 電池 / (TCA9546 経由 MPU) + Sigfox/BLE/LoRa
; ハード正本: ../../Monita_Flex_構成_v3.10.md（v3.03 に LoRa(E220-900T22S(JP)) を追加した版）
; v3.10_loraをベースに、LoRaダウンリンク受信（Gatewayからの設定変更）を追加する版

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
; DTR はデフォルト(1)のままにする。
; monitor_dtr=0 にすると Adafruit nRF52 コアが Serial.write() を無視するため出力が届かない。
; monitor_dtr = 0  ← 使用しない
; HX711 は `lib/HX711` に同梱（bogde/HX711 0.7.5 のコピー。レジストリ取得に失敗しても `pio run` 可能にする）
; Adafruit_TinyUSB.h は framework-arduinoadafruitnrf52 同梱（別途 lib_deps 不要）
; TCA9534 はレジスタ直叩き（Wire のみ）。7bit アドレスは src/main.cpp の TCA9534_ADDR（回路図の A0〜A2 に合わせる）
; DS18B20（1-Wire）を使う場合（USE_DS18B20=1）は以下の lib_deps を有効にする:
; VL53L4CD（CH_ASSIGN=4）を使う場合は stm32duino/STM32duino VL53L4CD が必要
; （STマイクロエレクトロニクス公式ライブラリ。Adafruit製品ガイドでもこの導入を案内している）
lib_deps =
  paulstoffregen/OneWire
  milesburton/DallasTemperature
  stm32duino/STM32duino VL53L4CD
; BLE モード（COMM_MODE_BLE）時は bluefruit.h がフレームワーク同梱のため追加不要
; upload_port = /dev/cu.usbmodemXXXX

; ── モード切替用ビルドフラグ（どれか一つのコメントを外す）──
;build_flags = -D COMM_MODE_SIGFOX
;build_flags = -D COMM_MODE_BLE
build_flags = -D COMM_MODE_LORA

; ── 機体別ビルド（DEVICE_ID の焼き分け）──
; DEVICE_ID は 上位3bit=Gateway群(0〜7) / 下位5bit=群内の機器番号(1〜31)。
;   群0 = 0x01〜0x1F、群1 = 0x21〜0x3F、群N の開始は N*0x20+1
;   下位5bitが0のID（0x20 等）は無効値。static_assert でビルドが失敗する
; 既定値は src/main.cpp の #ifndef DEVICE_ID（BLE=0x01 / LoRa=0x0E）。
; ここでは定義しない（定義すると下記の上書きが redefined 警告になるため）。
; 機体ごとに焼き分けるときはビルド時に上書きする:
;   PLATFORMIO_BUILD_FLAGS="-D DEVICE_ID=0x21" pio run -t upload   ; 群1・機器1
