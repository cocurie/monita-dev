; Monita Flex v3.02 — HX711×4（4052 A/B は TCA9534）/ 温度 / 電池 / (TCA9546 経由 MPU) + Sigfox AT$SF=
; ハード正本: ../../Monita_Flex_構成_v3.02.md（確定ピン・継承事項は v3.01 正本も参照）
; v3.01 向け実装との差分: ../../revisions/Monita_Flex_v3.01_to_v302_基板修正事項.md

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
; HX711 は `lib/HX711` に同梱（bogde/HX711 0.7.5 のコピー。レジストリ取得に失敗しても `pio run` 可能にする）
; Adafruit_TinyUSB.h は framework-arduinoadafruitnrf52 同梱（別途 lib_deps 不要）
; TCA9534 はレジスタ直叩き（Wire のみ）。7bit アドレスは src/main.cpp の TCA9534_ADDR（回路図の A0〜A2 に合わせる）
; upload_port = /dev/cu.usbmodemXXXX
