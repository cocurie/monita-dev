; 検証 Step19: LoRa親機（受信側）— E220-900T22S(JP) 透過モード受信テスト
; XIAO nRF52840 Sense（v3.10_loraと同じ環境）に E220 を直結。Flex基板は不要
; 18_lora_child と対で使う。M0/M1はGNDに直結（Mode0固定）してから書き込むこと

[env:seeed_xiao_nrf52840_sense]
platform  = https://github.com/Seeed-Studio/platform-seeedboards.git
board     = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
build_flags =
  -D USE_TINYUSB
; upload_port = /dev/cu.usbmodemXXXX
