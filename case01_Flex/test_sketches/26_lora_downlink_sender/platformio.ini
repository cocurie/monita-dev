; 検証 Step26: LoRaダウンリンク送信テストツール（ブレッドボード版）
; XIAO nRF52840 Sense + E220-900T22S(JP) をブレッドボードに直結。
; test_sketches/25_lora_downlink_child 宛てに、D0ボタン押下で
; ダウンリンクコマンド（Company ID/PktType/DeviceID検証付き）を1回送信する。
; Gateway実機には触れず、受信ロジック単体の動作確認を行うためのツール。

[env:seeed_xiao_nrf52840_sense]
platform  = https://github.com/Seeed-Studio/platform-seeedboards.git
board     = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
build_flags =
  -D USE_TINYUSB
; upload_port = /dev/cu.usbmodemXXXX
