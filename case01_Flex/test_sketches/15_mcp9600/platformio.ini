; 検証 Step15: MCP9600 熱電対アンプ I2C 動作確認
; XIAO nRF52840  SDA=D4  SCL=D5

[env:seeed_xiao_nrf52840_sense]
platform      = https://github.com/Seeed-Studio/platform-seeedboards.git
board         = seeed-xiao-afruitnrf52-nrf52840-sense
framework     = arduino
monitor_speed = 115200
build_flags =
  -D USE_TINYUSB
lib_deps =
  adafruit/Adafruit MCP9600 Library@^2.0.4
  adafruit/Adafruit BusIO@^1.16.0
