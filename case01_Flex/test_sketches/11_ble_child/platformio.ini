; 検証 Step11: BLE子機 — Flex v3.02 でひずみ4CH + バッテリーをアドバタイズ
; XIAO nRF52840 (non-Sense) + Monita Flex v3.02 基板

[env:seeed_xiao_nrf52840]
platform  = https://github.com/Seeed-Studio/platform-seeedboards.git
board     = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
lib_deps =
  bogde/HX711@^0.7.5
build_flags =
  -D USE_TINYUSB
