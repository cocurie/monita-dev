; 検証 Step22: LoRa複数台テスト用 子機（ブレッドボード版、ダミーデータ送信）
; XIAO nRF52840 Sense + E220-900T22S(JP) をブレッドボードに直結。Flex基板は使わない
; 受信側はGateway基板ver1.1（COMM_MODE_LORAビルド）の実機をそのまま使う
;
; v3.10_loraのLoRa部分（設定書込・フレーム送信・スリープ）をベースに、
; TCA9534・HX711・DS3231等は使わずXIAO直結ピン＋ダミーデータのみで動く簡易版

[env:seeed_xiao_nrf52840_sense]
platform  = https://github.com/Seeed-Studio/platform-seeedboards.git
board     = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
build_flags =
  -D USE_TINYUSB
; upload_port = /dev/cu.usbmodemXXXX
