; 検証 Step25: LoRaダウンリンク受信テスト用 子機（ブレッドボード版）
; XIAO nRF52840 Sense + E220-900T22S(JP) をブレッドボードに直結。Flex基板は使わない
; test_sketches/22_lora_multi_child をベースに、送信後の短いRXウィンドウで
; Gatewayからのダウンリンクコマンド（時刻補正・送信頻度・平均/メジアン回数）を
; 受信・検証・適用・フラッシュ保存するテストを追加した
;
; 受信側の相手（送信元）はGateway実機 or 別途用意するダウンリンク送信テストツールを使う

[env:seeed_xiao_nrf52840_sense]
platform  = https://github.com/Seeed-Studio/platform-seeedboards.git
board     = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
build_flags =
  -D USE_TINYUSB
; upload_port = /dev/cu.usbmodemXXXX
