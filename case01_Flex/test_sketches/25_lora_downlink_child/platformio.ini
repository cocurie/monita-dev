; 検証 Step25: LoRaダウンリンク受信テスト用 子機（Flex実機版）
; ★2026-08-07: ブレッドボード版はE220のM0/M1をXIAO直結ピンで制御していたが、
; 実機Flex v3.1x基板はTCA9534(U6)のP2経由（I2C制御）で共通駆動する設計のため、
; ブレッドボード版のままでは実機でLoRa設定確認(config read)が失敗する。
; 本バージョンはFlex実機（v3.10_loraと同一のTCA9534/3V3_SW制御）に対応済み。
;
; 送信後の短いRXウィンドウで、Gatewayからのダウンリンクコマンド
; （時刻補正・送信頻度・平均/メジアン回数）を受信・検証・適用・フラッシュ保存する。
; 送信側（相手）は test_sketches/26_lora_downlink_sender を使う。

[env:seeed_xiao_nrf52840_sense]
platform  = https://github.com/Seeed-Studio/platform-seeedboards.git
board     = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
build_flags =
  -D USE_TINYUSB
; upload_port = /dev/cu.usbmodemXXXX
