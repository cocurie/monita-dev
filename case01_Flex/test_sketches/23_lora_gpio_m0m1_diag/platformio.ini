; 検証 Step23: LoRa GPIO M0/M1 切替タイミング診断（22番のconfig read失敗の切り分け用）
; XIAO nRF52840 Sense + E220-900T22S(JP) をブレッドボードに直結。配線は22番と同じ
; （D1=M0, D2=M1, D8/D9=UART）だが、本スケッチはM0/M1を起動直後からHIGH固定にする
; （Step20の手動3V3ジャンパと同じ状況をGPIO経由で再現し、LOW→HIGH遷移特有の
;   問題かどうかを切り分けるための一時的な診断ツール）

[env:seeed_xiao_nrf52840_sense]
platform  = https://github.com/Seeed-Studio/platform-seeedboards.git
board     = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
build_flags =
  -D USE_TINYUSB
; upload_port = /dev/cu.usbmodemXXXX
