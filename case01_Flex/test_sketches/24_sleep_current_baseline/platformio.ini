; 検証 Step24: スリープ電流ベースライン測定（最小構成）
; XIAO nRF52840 Sense（v3.03/v3.10 基板と同じボード定義）
;
; 目的: 本番ファーム（v3.10）のスリープ中に残る 2.84ms 周期・約2.5〜3mA の
;       スパイクが、Adafruit nRF52 コア／FreeRTOS のベースライン由来なのか、
;       それとも本番ファーム側の初期化処理に起因するのかを切り分ける。
;
; TEST_STAGE（src/main.cpp）を 0 から順に上げて、どの初期化で
; スパイクが出始めるかを二分探索する。

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
