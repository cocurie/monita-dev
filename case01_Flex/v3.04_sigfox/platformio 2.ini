; Monita Flex v3.04 — HX711×4（4052 A/B は TCA9534）/ DS3231温度 / 電池 + SDカードCSV記録 + Sigfox/BLE
; ハード正本: 【7】Monita/開発/Flex基板/（v3.04 ネットリスト）
;
; v3.03 からのファーム差分（基板改版に対応）:
;   - 3V3_SW 制御: D10 直結GPIO → TCA9534 P2（I2C経由）へ移動
;   - D10 は SD カード SPI SCK へ転用（D1=MOSI, D2=MISO, CS=TCA9534 P3）
;   - I2C は Wire(TWIM) を廃し GPIO ビットバンに統一（BLE SoftDevice 競合回避）
;   - 電池電圧センス: A3 → D3
;   - 毎サイクル SD へ CSV 記録（timestamp,ch1..4,temp,batt）

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
; DTR はデフォルト(1)のままにする。
; monitor_dtr=0 にすると Adafruit nRF52 コアが Serial.write() を無視するため出力が届かない。
; スリープ中の DTR リセットループは DEBUG_NO_SLEEP=1 でスリープをスキップすることで回避する。

; HX711 は `lib/HX711` に同梱（bogde/HX711 0.7.5 のコピー）
; SdFat は SD カード CSV 記録に使用（xiao_ble_sd_flex で cold boot 初期化を実証済み）
; Adafruit_TinyUSB.h は framework-arduinoadafruitnrf52 同梱（別途 lib_deps 不要）
; I2C はビットバン（Wire 不使用）。TCA9534/DS3231 のみアクセスするため OneWire/DallasTemperature も現状不要
;   （CH_ASSIGN に 3=DS18B20 を使う場合は lib_deps に OneWire/DallasTemperature を復活させる）
lib_deps =
  greiman/SdFat@^2.2.3
; upload_port = /dev/cu.usbmodemXXXX

; ── モード切替用ビルドフラグ（どちらか一方のコメントを外す）──
; build_flags = -D COMM_MODE_SIGFOX
build_flags = -D COMM_MODE_BLE
