[env:seeed-xiao-afruitnrf52-nrf52840-sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino

monitor_speed = 115200
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
build_flags = -DUSE_TINYUSB

lib_deps =
    /Users/takasaki/.platformio/packages/framework-arduinoadafruitnrf52/libraries/Adafruit_TinyUSB_Arduino
    adafruit/Adafruit SHT4x Library@^1.0.5
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.6
    seeed-studio/Seeed Arduino LSM6DS3@^2.0.5
    https://github.com/stm32duino/LSM6DSO32.git
