; Monita Flex v3.3 — 村本建設 Phase1 現場実証ファーム
; ベース: v3.03 Sigfox + XIAO Sense 傾き・IC温度追加

[env:muramoto_flex_v33]
platform   = https://github.com/Seeed-Studio/platform-seeedboards.git
board      = seeed-xiao-afruitnrf52-nrf52840-sense
framework  = arduino
monitor_speed = 115200
upload_port   = /dev/cu.usbmodem101
monitor_port  = /dev/cu.usbmodem101

build_flags = -D COMM_MODE_SIGFOX

lib_deps =
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    seeed-studio/Seeed Arduino LSM6DS3@^2.0.5

[env:muramoto_flex_v33_debug]
extends    = env:muramoto_flex_v33
build_flags =
    -D COMM_MODE_SIGFOX
    -DDEBUG_MODE
