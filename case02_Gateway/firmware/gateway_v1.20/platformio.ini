; Monita Gateway v1.20 — BLE/LoRa 受信 + LTE-M → GAS 送信（AC電源版）
; v1.1をベースに、LoRaダウンリンク（スプレッドシート→GAS→Gateway→子機の設定変更）を追加する版
; MCU    : Seeed XIAO nRF52840
; モジュール: M5Stamp CAT-M（SIM7080G）、（LoRaビルドのみ）E220-900T22S(JP)-EV2
; RTC    : DS3231（I2C: D4=SDA, D5=SCL）
; SD     : microSD SPI（D3=CS 直結、SCK/MISO/MOSI=D8/D9/D10）
; UART   : D6(TX) → SIM7080G RX / D7(RX) ← SIM7080G TX
; 電源   : XIAO Type-C給電。SIM7080GはXIAOの5Vへ直結（v1.0と同じ、電源制御回路なし）
; LoRa UART（COMM_MODE_LORA時）: UARTE1、D0(RX)/D1(TX)、D2=E220 M0・M1共通駆動（基板でM0/M1短絡）
; ★2026-07-19: 回路図 ver1.10.sch に合わせてピン確定（SD CS=D3, LoRa RX=D0/TX=D1/M0M1=D2）

[env:seeed_xiao_nrf52840]

platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino

monitor_speed = 115200
monitor_filters = time
monitor_port = /dev/cu.usbmodem*

lib_deps =
  adafruit/RTClib @ ^2.1.4
  arduino-libraries/SD @ ^1.2.4

; ── モード切替用ビルドフラグ（どちらか一方のコメントを外す）──
; build_flags =
;   -D USE_TINYUSB
;   -D COMM_MODE_BLE
build_flags =
  -D USE_TINYUSB
  -D COMM_MODE_LORA

; ── Gateway群（GATEWAY_GROUP_ID）★2026-08-28追加 ──
; 1つの現場にGatewayを複数台置くとき、どの子機を受信するかを決める群番号（0〜7）。
; 子機のDeviceIDは 上位3bit=群 / 下位5bit=機器番号(1〜31) で、Gatewayは自群の
; 上位3bitと一致するLoRaフレームだけを受信する（BLEは第3段階まで従来のホワイトリスト方式）。
;   群0 = 0x01〜0x1F、群1 = 0x21〜0x3F、群N の開始は N*0x20+1
; 既定値0（従来と等価）は src/main.cpp の #ifndef GATEWAY_GROUP_ID で定義しているため
; ここでは定義しない（定義すると下記の上書きが redefined 警告になる）。
; 2台目以降を焼くときはビルド時に上書きする:
;   PLATFORMIO_BUILD_FLAGS="-D GATEWAY_GROUP_ID=1" pio run -t upload
; 全群でダウンリンク有効。GASがgroupに一致する子機予約だけを返す。

; One と組み合わせ、14バイト/台（電池電圧付き）で送る場合のみこちらを有効化する。
; 既定は上の13バイト/台形式のままとし、既存現場の旧GASとの互換性を守る。
; build_flags =
;   -D USE_TINYUSB
;   -D COMM_MODE_LORA
;   -D CLOUD_FMT_V2

; ── MQTT経由のリモートコマンド機能（★2026-08-03追加、★2026-08-04断念）──
; EMQX経由でcmdトピックを購読する方式を試したが、SIM7080Gのこのファームウェアでは
; 内蔵MQTTクライアント・生ソケットへのTLS適用のどちらも動作しないことが実機検証で判明し、
; 断念した（自前MQTT実装＋TLS化まで試したがAT+CASSLCFGがoperation not allowedで機能せず）。
; 代わりにGASのHTTPS経由でコマンドをポーリングする方式（checkRemoteCmd()、常時有効）に
; 切り替え済み。以下のコードは将来モジュールを載せ替えた際の参考用に残してある
; （MQTT_CMD_ENABLEDを付けてビルドすれば有効化できるが、現行モジュールでは動作しない）。
