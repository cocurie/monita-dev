; 検証 Step03: LoRaダウンリンク送信テストツール（Gateway v1.1実機版）
; test_sketches/25_lora_downlink_child（Flex実機、case01_Flex側）宛てに、
; 一定間隔で自動的にダウンリンクコマンドを1回送信する。
;
; ★2026-08-07: 当初はXIAO+E220ブレッドボード単体（case01_Flex/test_sketches/26_lora_downlink_sender、
; D0ボタン押下で送信）で作ったが、Gateway v1.1実機で進めることになったため新規作成。
; Gateway v1.1はD0がLoRa RXピンとして使用済み（ボタン無し）のため、ボタン押下ではなく
; 一定間隔での自動連続送信にした。LoRa UARTもGateway v1.1と同じUARTE1(D0/D1)を使う
; （FlexのSerial1(D8/D9)とは配線・実装方式が異なる）。
;
; MCU: Seeed XIAO nRF52840（Sense版ではない。Gateway v1.1実機と同一ボード定義）
; LoRa: E220-900T22S(JP)。D0(RX)/D1(TX)=UARTE1、D2=M0・M1共通駆動（基板でM0/M1短絡）

[env:seeed_xiao_nrf52840]
platform  = https://github.com/Seeed-Studio/platform-seeedboards.git
board     = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
build_flags =
  -D USE_TINYUSB
; upload_port = /dev/cu.usbmodemXXXX
