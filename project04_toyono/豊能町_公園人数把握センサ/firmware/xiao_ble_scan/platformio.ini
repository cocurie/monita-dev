; BLE 公園人流測定 — XIAO nRF52840 Sense スキャンログ（Arduino / PlatformIO）
; Seeed 提供プラットフォーム: https://wiki.seeedstudio.com/xiao_nrf52840_with_platform_io/

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1101

; 複数シリアルがある Mac では必須に近い。番号は抜き差しで変わるので pio device list で確認のうえ追記
; upload_port = /dev/cu.usbmodem1101
