; 豊能町公園人流測定 — Monita Flex v3.04
; BLE スキャン + SD カード記録 + PIR + 音声(PDM)解析
;
; PIR / 音声解析は src/main.cpp 冒頭の ENABLE_PIR / ENABLE_AUDIO で ON/OFF する

[env:seeed_xiao_nrf52840_sense]
platform      = https://github.com/Seeed-Studio/platform-seeedboards.git
board         = seeed-xiao-afruitnrf52-nrf52840-sense
framework     = arduino
monitor_speed = 115200
monitor_filters =
  send_on_enter
  default
build_flags =
  -D USE_TINYUSB
lib_deps =
  greiman/SdFat@^2.2.3
  kosme/arduinoFFT
