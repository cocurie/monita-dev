; 豊能町公園人流測定 — Monita Flex v3.04
; Phase-1: BLE スキャン + SD カード記録
;
; Phase-2 (PIR D8) / Phase-3 (音声 PDM) は main.cpp のコメントを外す
; Phase-3 有効化時は下の kosme/arduinoFFT のコメントも外す

[env:seeed_xiao_nrf52840_sense]
platform      = https://github.com/Seeed-Studio/platform-seeedboards.git
board         = seeed-xiao-afruitnrf52-nrf52840-sense
framework     = arduino
monitor_speed = 115200
build_flags =
  -D USE_TINYUSB
  -D SD_CHIP_SELECT_MODE=1
lib_deps =
  greiman/SdFat@^2.2.3
  ; kosme/arduinoFFT    ; Phase-3 (音声) 有効化時にコメント解除
