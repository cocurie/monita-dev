; 豊能町 斜面崩落モニタ — Monita Flex v3.03 / XIAO nRF52840 Sense
;
; 用途: 斜面崩落地の樹木に取り付け、XIAO 内蔵加速度センサ(LSM6DS3TR-C)で
;       樹木の傾き(鉛直からの総合傾斜角)をモニタし、Sigfox で送信する。
;
; ベース: case01_Flex/v3.03_sigfox（Sigfox D8/D9・3V3_SW D10・電池分圧 A3・RTC2 スリープ）
; ハード正本: Monita_Flex_構成_v3.03.md（回路図と食い違う場合は回路図を正とする）

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
; DTR はデフォルト(1)のまま。monitor_dtr=0 は Adafruit nRF52 コアで Serial 出力が届かなくなる。

lib_deps =
  ; XIAO 内蔵 6軸 IMU(LSM6DS3TR-C, 0x6A) 読み取り用
  seeed-studio/Seeed Arduino LSM6DS3@^2.0.5
; Adafruit_TinyUSB.h は framework-arduinoadafruitnrf52 同梱（lib_deps 不要）

build_flags = -D COMM_MODE_SIGFOX
