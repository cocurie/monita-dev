; 豊能町 埋設水道管 共振探査 — 掃引正弦波(チャープ)出力テスト / XIAO nRF52840 (Sense)
;
; 用途: PWM-DDSで20Hz〜2kHzの対数スイープ正弦波を生成し、LPF+パワーアンプ経由で
;       スピーカー→消火栓→埋設水道管を加振するための「まずスイープ波形が出るか」確認用ファーム。
;       加速度センサ側のロックイン検波は未実装（次段階）。
;
; 出力ピン: D0 (PWM, 8bit, 16MHz/256 ≈ 62.5kHz キャリア) → 外付けLPF(RC等)でキャリア除去 → パワーアンプへ

[env:seeed_xiao_nrf52840_sense]
platform      = https://github.com/Seeed-Studio/platform-seeedboards.git
board         = seeed-xiao-afruitnrf52-nrf52840-sense
framework     = arduino
monitor_speed = 115200
; DTR はデフォルト(1)のまま。monitor_dtr=0 は Adafruit nRF52 コアで Serial 出力が届かなくなる。
build_flags =
  -D USE_TINYUSB
